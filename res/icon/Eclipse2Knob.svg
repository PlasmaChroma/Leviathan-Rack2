     stroke="#0b0c0d"
     stroke-width="1.2"
     id="circle22" />
  <!-- Outer Bezel Specular Ring -->
  <circle
     cx="60"
     cy="60"
     r="52.2"
     fill="none"
     stroke="url(#specularGrad)"
     stroke-width="0.8"
     id="circle23" />
  <!-- Inner Bezel Groove (Shadow) -->
  <circle
     cx="60"
     cy="60"
     r="47.5"
     fill="none"
     stroke="#08090a"
     stroke-width="1.0"
     id="circle24" />
  <!-- Main Knob Face -->
  <circle
     cx="60"
     cy="60"
     r="46.5"
     fill="url(#knobFaceGrad)"
     id="circle25" />
  <circle
     cx="60"
     cy="60"
     r="46.5"
     fill="none"
     stroke="#25272b"
     stroke-width="0.8"
     id="circle26" />
  <!-- Shiny Outer Edge of the Face -->
  <circle
     cx="60"
     cy="60"
     r="44.5"
     fill="none"
     stroke="#121316"
     stroke-width="0.5"
     id="circle27" />
  <!-- Recessed Inner Cap -->
  <circle
     cx="60"
     cy="60"
     r="37.5"
     fill="url(#centerCapGrad)"
     stroke="#070809"
     stroke-width="1.5"
     id="circle28" />
  <!-- Inner Highlight Ring -->
  <circle
     cx="60"
     cy="60"
     r="36"
     fill="none"
     stroke="#2b2d33"
     stroke-width="0.6"
     id="circle29" />
  <!-- Pointer Needle & Center Pin (Grouped to rotate together with background cap) -->
  <g
     id="pointer-group"
     transform="translate(60,60)">
    <!-- Glowing Pointer Shadow/Aura -->
    <line
       x1="0"
       y1="2"
       x2="0"
       y2="-36"
       stroke="#ff5f00"
       stroke-width="5.5"
       stroke-linecap="round"
       opacity="0.38"
       id="line29"
       style="fill:none" />
    <line
       x1="0"
       y1="2"
       x2="0"
       y2="-36"
       stroke="#ffa300"
       stroke-width="3.8"
       stroke-linecap="round"
       opacity="0.65"
       id="line30"
       style="fill:none" />
    <!-- Core Pointer Needle -->
    <line
       x1="0"
       y1="1"
       x2="0"
       y2="-35.5"
       stroke="url(#needleGlowGrad)"
       stroke-width="2.5"
       stroke-linecap="round"
       id="line31"
       style="fill:none" />
    <!-- Specular core line -->
    <line
       x1="0"
       y1="0"
       x2="0"
       y2="-34.5"
       stroke="#ffffff"
       stroke-width="0.8"
       stroke-linecap="round"
       opacity="0.75"
       id="line32"
       style="fill:none;fill-opacity:1" />
    <!-- Needle Base Ring (Bulb) -->
    <circle
       cx="0"
       cy="0"
       r="8"
       fill="#1b1c1f"
       stroke="#0b0c0d"
       stroke-width="0.8"
       id="circle32"
       style="display:none" />
    <circle
       cx="0"
       cy="0"
       r="6.8000002"
       fill="url(#centerPinGrad)"
       id="circle33"
       style="display:inline;opacity:0.819;fill:url(#linearGradient35)" />
    <circle
       cx="0"
       cy="0"
       r="6.8000002"
       fill="url(#pinSpec)"
       id="circle34"
       style="display:none;fill:url(#pinSpec)" />
    <!-- Center pin screw hole -->
    <circle
       cx="0"
       cy="0"
       r="2.2"
       fill="#0b0c0d"
       id="circle35"
       style="display:none" />
