<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 120 120"
   width="120"
   height="120"
   version="1.1"
   id="svg35"
   sodipodi:docname="Eclipse2Knob.svg"
   inkscape:version="1.4.3 (0d15f75, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview35"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     showguides="false"
     inkscape:zoom="19.583333"
     inkscape:cx="66.53617"
     inkscape:cy="36.53617"
     inkscape:window-width="2560"
     inkscape:window-height="1377"
     inkscape:window-x="-8"
     inkscape:window-y="-8"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg35" />
  <defs
     id="defs22">
    <!-- Metallic outer bezel gradient -->
    <linearGradient
       id="metalBezelGrad"
       x1="0%"
       y1="0%"
       x2="100%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#55585d"
         id="stop1" />
      <stop
         offset="30%"
         stop-color="#2d2f32"
         id="stop2" />
      <stop
         offset="50%"
         stop-color="#1b1c1e"
         stop-opacity="1"
         id="stop3" />
      <stop
         offset="75%"
         stop-color="#3e4146"
         id="stop4" />
      <stop
         offset="100%"
         stop-color="#141517"
         id="stop5" />
    </linearGradient>
    <!-- Dark knob face radial gradient -->
    <radialGradient
       id="knobFaceGrad"
       cx="60"
       cy="60"
       r="46"
       fx="50"
       fy="50"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0%"
         stop-color="#2a2c30"
         id="stop6" />
      <stop
         offset="70%"
         stop-color="#141518"
         id="stop7" />
      <stop
         offset="100%"
         stop-color="#090a0c"
         id="stop8" />
    </radialGradient>
    <!-- Recessed center cap radial gradient -->
    <radialGradient
       id="centerCapGrad"
       cx="60"
       cy="60"
       r="38"
       fx="55"
       fy="55"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0%"
         stop-color="#1f2125"
         id="stop9" />
      <stop
         offset="85%"
         stop-color="#0f1012"
         id="stop10" />
      <stop
         offset="100%"
         stop-color="#050607"
         id="stop11" />
    </radialGradient>
    <!-- Bezel specular highlight gradient -->
    <linearGradient
       id="specularGrad"
       x1="0%"
       y1="0%"
       x2="0%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#ffffff"
         stop-opacity="0.28"
         id="stop12" />
      <stop
         offset="100%"
         stop-color="#000000"
         stop-opacity="0.8"
         id="stop13" />
    </linearGradient>
    <!-- Glowing Orange Gradient for the needle -->
    <linearGradient
       id="needleGlowGrad"
       x1="0%"
       y1="100%"
       x2="0%"
       y2="0%">
      <stop
         offset="0%"
         stop-color="#ff7a18"
         stop-opacity="0.8"
         id="stop14" />
      <stop
         offset="60%"
         stop-color="#ffa33b"
         stop-opacity="0.95"
         id="stop15" />
      <stop
         offset="100%"
         stop-color="#ffea9f"
         stop-opacity="1.0"
         id="stop16" />
