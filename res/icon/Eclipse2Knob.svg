       x1="0%"
       y1="0%"
       x2="100%"
       y2="100%">
      <stop
         offset="0"
         stop-color="#ffd59a"
         id="stop17"
         style="stop-color:#fffae7;stop-opacity:1;" />
      <stop
         offset="0.79838717"
         stop-color="#e08224"
         id="stop18"
         style="stop-color:#ffea9f;stop-opacity:1;" />
      <stop
         offset="0.89932597"
         stop-color="#7e3309"
         id="stop19"
         style="stop-color:#ce7d07;stop-opacity:1;" />
    </linearGradient>
    <!-- Specular highlight for center pin -->
    <radialGradient
       id="pinSpec"
       cx="0.0025530532"
       cy="-0.099574603"
       r="8.8399999"
       fx="0.0025530532"
       fy="-0.099574603"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#ffffff"
         stop-opacity="0.6"
         id="stop20"
         style="stop-color:#ffffff;stop-opacity:0.51358694;" />
      <stop
         offset="1"
         stop-color="#ffa33b"
         stop-opacity="0.2"
         id="stop21"
         style="stop-color:#fffae7;stop-opacity:1;" />
    </radialGradient>
    <linearGradient
       inkscape:collect="always"
       xlink:href="#centerPinGrad"
       id="linearGradient35"
       x1="-0.06044054"
       y1="-28.380558"
       x2="0.13265467"
       y2="5.5605674"
       gradientUnits="userSpaceOnUse" />
