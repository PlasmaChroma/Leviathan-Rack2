<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="24mm" height="120mm" viewBox="0 0 24 120">
  <title>Leviathan Dual-Sided Outward Teeth Slider Track</title>
  <desc>VCV Rack / NanoSVG-friendly slider rack track with outward teeth on left and right sides.</desc>

  <defs>
    <linearGradient id="rackCore" x1="0" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58fff6"/>
      <stop offset="0.48" stop-color="#11b8d0"/>
      <stop offset="1" stop-color="#54fff3"/>
    </linearGradient>
    <linearGradient id="rackShade" x1="8" y1="0" x2="16" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#042b35"/>
      <stop offset="0.46" stop-color="#18e7f0"/>
      <stop offset="0.54" stop-color="#18e7f0"/>
      <stop offset="1" stop-color="#042b35"/>
    </linearGradient>
  </defs>

  <!-- Soft outer aura built from transparent geometry, no filters. -->
  <rect x="7.10" y="3.00" width="9.80" height="114.00" rx="1.20" fill="#00eaff" opacity="0.10"/>
  <rect x="8.10" y="4.00" width="7.80" height="112.00" rx="0.80" fill="#00eaff" opacity="0.16"/>

  <!-- Dark backing channel. -->
  <rect x="8.60" y="4.00" width="6.80" height="112.00" rx="0.55" fill="#061018" stroke="#3d2774" stroke-width="0.45"/>

  <!-- Central luminous spine. -->
  <rect x="10.65" y="5.25" width="2.70" height="109.50" rx="0.30" fill="url(#rackShade)"/>
  <rect x="11.62" y="5.70" width="0.76" height="108.60" rx="0.18" fill="#a8ffff" opacity="0.58"/>

  <!-- Left outward teeth: bases near center, tips point outward to the left. -->
  <path d="
    M 10.65 6.00
    L 7.35 8.00 L 10.65 10.00
    L 10.65 12.00 L 7.35 14.00 L 10.65 16.00
    L 10.65 18.00 L 7.35 20.00 L 10.65 22.00
    L 10.65 24.00 L 7.35 26.00 L 10.65 28.00
    L 10.65 30.00 L 7.35 32.00 L 10.65 34.00
    L 10.65 36.00 L 7.35 38.00 L 10.65 40.00
    L 10.65 42.00 L 7.35 44.00 L 10.65 46.00
    L 10.65 48.00 L 7.35 50.00 L 10.65 52.00
    L 10.65 54.00 L 7.35 56.00 L 10.65 58.00
    L 10.65 60.00 L 7.35 62.00 L 10.65 64.00
    L 10.65 66.00 L 7.35 68.00 L 10.65 70.00
    L 10.65 72.00 L 7.35 74.00 L 10.65 76.00
    L 10.65 78.00 L 7.35 80.00 L 10.65 82.00
    L 10.65 84.00 L 7.35 86.00 L 10.65 88.00
    L 10.65 90.00 L 7.35 92.00 L 10.65 94.00
    L 10.65 96.00 L 7.35 98.00 L 10.65 100.00
    L 10.65 102.00 L 7.35 104.00 L 10.65 106.00
    L 10.65 108.00 L 7.35 110.00 L 10.65 112.00
    Z" fill="url(#rackCore)" opacity="0.94"/>

  <!-- Right outward teeth: bases near center, tips point outward to the right. -->
  <path d="
    M 13.35 6.00
    L 16.65 8.00 L 13.35 10.00
    L 13.35 12.00 L 16.65 14.00 L 13.35 16.00
    L 13.35 18.00 L 16.65 20.00 L 13.35 22.00
    L 13.35 24.00 L 16.65 26.00 L 13.35 28.00
    L 13.35 30.00 L 16.65 32.00 L 13.35 34.00
    L 13.35 36.00 L 16.65 38.00 L 13.35 40.00
    L 13.35 42.00 L 16.65 44.00 L 13.35 46.00
    L 13.35 48.00 L 16.65 50.00 L 13.35 52.00
    L 13.35 54.00 L 16.65 56.00 L 13.35 58.00
    L 13.35 60.00 L 16.65 62.00 L 13.35 64.00
    L 13.35 66.00 L 16.65 68.00 L 13.35 70.00
    L 13.35 72.00 L 16.65 74.00 L 13.35 76.00
    L 13.35 78.00 L 16.65 80.00 L 13.35 82.00
    L 13.35 84.00 L 16.65 86.00 L 13.35 88.00
    L 13.35 90.00 L 16.65 92.00 L 13.35 94.00
    L 13.35 96.00 L 16.65 98.00 L 13.35 100.00
    L 13.35 102.00 L 16.65 104.00 L 13.35 106.00
    L 13.35 108.00 L 16.65 110.00 L 13.35 112.00
    Z" fill="url(#rackCore)" opacity="0.94"/>

  <!-- Tooth ridge highlights. -->
  <path d="M10.65 6 L7.35 8 L10.65 10 M10.65 18 L7.35 20 L10.65 22 M10.65 30 L7.35 32 L10.65 34 M10.65 42 L7.35 44 L10.65 46 M10.65 54 L7.35 56 L10.65 58 M10.65 66 L7.35 68 L10.65 70 M10.65 78 L7.35 80 L10.65 82 M10.65 90 L7.35 92 L10.65 94 M10.65 102 L7.35 104 L10.65 106" fill="none" stroke="#baffff" stroke-width="0.20" opacity="0.62"/>
  <path d="M13.35 6 L16.65 8 L13.35 10 M13.35 18 L16.65 20 L13.35 22 M13.35 30 L16.65 32 L13.35 34 M13.35 42 L16.65 44 L13.35 46 M13.35 54 L16.65 56 L13.35 58 M13.35 66 L16.65 68 L13.35 70 M13.35 78 L16.65 80 L13.35 82 M13.35 90 L16.65 92 L13.35 94 M13.35 102 L16.65 104 L13.35 106" fill="none" stroke="#baffff" stroke-width="0.20" opacity="0.62"/>

  <!-- Outer mechanical edge lines. -->
  <path d="M7.10 5.00 L7.10 115.00" stroke="#1a7f92" stroke-width="0.28" opacity="0.70"/>
  <path d="M16.90 5.00 L16.90 115.00" stroke="#1a7f92" stroke-width="0.28" opacity="0.70"/>
  <path d="M9.15 5.00 L9.15 115.00" stroke="#062832" stroke-width="0.25" opacity="0.65"/>
  <path d="M14.85 5.00 L14.85 115.00" stroke="#062832" stroke-width="0.25" opacity="0.65"/>

  <!-- Registration / mount notches, optional visual anchors. -->
  <circle cx="12" cy="4.05" r="0.55" fill="#89ffff" opacity="0.55"/>
  <circle cx="12" cy="115.95" r="0.55" fill="#89ffff" opacity="0.55"/>
</svg>
