<?xml version="1.0" encoding="UTF-8"?>
<svg
   width="19.8426"
   height="11.74218"
   viewBox="0 0 19.8426 11.74218"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient
       id="carriageMetal"
       x1="2"
       y1="1"
       x2="17.8"
       y2="10.7"
       gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#aeb7c2" />
      <stop offset="0.32" stop-color="#687684" />
      <stop offset="0.68" stop-color="#34414e" />
      <stop offset="1" stop-color="#151c25" />
    </linearGradient>
    <linearGradient
       id="brassRetainer"
       x1="0"
       y1="2.1"
       x2="0"
       y2="9.7"
       gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe28a" />
      <stop offset="0.42" stop-color="#c99327" />
      <stop offset="1" stop-color="#67400a" />
    </linearGradient>
  </defs>

  <!-- Fixed down-right carriage shadow; kept filter-free for Rack/NanoSVG. -->
  <path
     d="M 3.05,1.35 H 16.79 L 18.62,3.12 V 8.62 L 16.79,10.39 H 3.05 L 1.22,8.62 V 3.12 Z"
     transform="translate(0.45,0.55)"
     fill="#000000"
     opacity="0.62" />

  <!-- Chamfered titanium rack carriage. -->
  <path
     d="M 3.05,0.8 H 16.79 L 18.62,2.57 V 8.62 L 16.79,10.94 H 3.05 L 1.22,8.62 V 2.57 Z"
     fill="url(#carriageMetal)"
     stroke="#080b10"
     stroke-width="0.7"
     stroke-linejoin="round" />

  <!-- Side notches visually engage the toothed rack. -->
  <path
     d="M 1.22,3.18 L 0.25,3.72 L 1.22,4.27 Z
        M 1.22,7.47 L 0.25,8.02 L 1.22,8.56 Z
        M 18.62,3.18 L 19.59,3.72 L 18.62,4.27 Z
        M 18.62,7.47 L 19.59,8.02 L 18.62,8.56 Z"
     fill="#4e5c69"
     stroke="#080b10"
     stroke-width="0.38"
     stroke-linejoin="round" />

  <!-- Recess beneath the independently rendered cyan/purple slider light. -->
  <rect
     x="5.05"
     y="2.48"
     width="9.74"
     height="6.78"
     rx="1.65"
     fill="#02040a"
     stroke="#111a27"
     stroke-width="0.55" />
  <rect
     x="5.62"
     y="3.05"
     width="8.60"
     height="5.64"
     rx="1.25"
     fill="#070914"
     stroke="#76521a"
     stroke-width="0.38" />

  <!-- Brass retainers tie the carriage to the new gear axle treatment. -->
  <circle cx="3.45" cy="5.87" r="1.05" fill="#3b2408" />
  <circle cx="3.45" cy="5.87" r="0.72" fill="url(#brassRetainer)" />
  <circle cx="16.39" cy="5.87" r="1.05" fill="#3b2408" />
  <circle cx="16.39" cy="5.87" r="0.72" fill="url(#brassRetainer)" />

  <path
     d="M 3.2,1.52 H 16.64"
     fill="none"
     stroke="#d5dde4"
     stroke-width="0.35"
     stroke-linecap="round"
     opacity="0.42" />
</svg>
