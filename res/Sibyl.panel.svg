<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="50.8mm" height="128.5mm" viewBox="0 0 5080 12850" version="1.1" id="sibyl-panel">
  <defs>
    <linearGradient id="sibyl-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1320" />
      <stop offset="0.5" stop-color="#080b14" />
      <stop offset="1" stop-color="#040508" />
    </linearGradient>
    <linearGradient id="sibyl-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7254d9" />
      <stop offset="0.5" stop-color="#30d7de" />
      <stop offset="1" stop-color="#7254d9" />
    </linearGradient>
    <linearGradient id="section-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c2e" stop-opacity="0.6" />
      <stop offset="1" stop-color="#0a0d17" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  <g id="panel_art" inkscape:label="Panel artwork">
    <!-- Base plate -->
    <rect x="0" y="0" width="5080" height="12850" fill="url(#sibyl-bg)" />
    <!-- Panel bevel border -->
    <rect x="45" y="45" width="4990" height="12760" rx="90" fill="none" stroke="url(#sibyl-edge)" stroke-width="34" opacity="0.8" />

    <!-- OLED display bezel -->
    <rect x="240" y="1300" width="4600" height="2400" rx="140" fill="#05080e" stroke="#229aa3" stroke-width="20" opacity="0.85" />

    <!-- Left section: Inputs box -->
    <rect x="240" y="3900" width="2350" height="8400" rx="120" fill="url(#section-grad)" stroke="#3a4b6e" stroke-width="14" opacity="0.6" />

    <!-- Right section: Outputs box -->
    <rect x="2690" y="3900" width="2150" height="8400" rx="120" fill="url(#section-grad)" stroke="#5d43b8" stroke-width="14" opacity="0.6" />

    <!-- Header line under titles -->
    <path d="M 240 1200 H 4840" fill="none" stroke="#229aa3" stroke-width="16" opacity="0.4" />
  </g>
</svg>
