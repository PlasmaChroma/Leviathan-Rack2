  <path d="M3048 180 V12670" stroke="#d7bc68" stroke-opacity="0.72" stroke-width="26"/>
  <path d="M12192 180 V12670" stroke="#67e7f4" stroke-opacity="0.62" stroke-width="26"/>

  <!-- The authored 18 HP raster is drawn over this centered structural bed. -->
  <rect x="3048" y="0" width="9144" height="12850" fill="#020718"/>

  <g id="components" opacity="0">
    <rect id="playfield_rect" x="5098" y="2050" width="5040" height="7500"/>

