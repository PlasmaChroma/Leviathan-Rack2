    <linearGradient id="outputRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07506b"/>
      <stop offset="1" stop-color="#061a3c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2ad"/>
      <stop offset="0.45" stop-color="#dcae45"/>
      <stop offset="1" stop-color="#7c3e17"/>
    </linearGradient>
  </defs>

  <rect width="13716" height="12850" fill="url(#panel)"/>
  <rect x="90" y="90" width="13536" height="12670" rx="230"
        fill="none" stroke="#cfefff" stroke-opacity="0.56" stroke-width="42"/>
  <rect x="145" y="145" width="13426" height="12560" rx="190"
