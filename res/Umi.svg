<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="137.16mm" height="128.5mm" viewBox="0 0 13716 12850">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06142f"/>
      <stop offset="0.5" stop-color="#03091d"/>
      <stop offset="1" stop-color="#01040e"/>
    </linearGradient>
    <linearGradient id="inputRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a1234"/>
      <stop offset="1" stop-color="#322372"/>
