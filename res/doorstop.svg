    <circle id="SPRING_BASE" cx="762" cy="7100" r="50"/>
    <rect id="ENERGY_METER" x="220" y="7930" width="1084" height="240"/>
    <rect id="MANUAL_HIT_REGION" x="110" y="1730" width="1304" height="5380"/>
    <circle id="TRIG_INPUT" cx="762" cy="9300" r="220"/>
    <circle id="VELOCITY_INPUT" cx="762" cy="10700" r="220"/>
    <circle id="AUDIO_OUTPUT" cx="762" cy="12100" r="220"/>
  </g>

  <g id="labels" inkscape:groupmode="layer" inkscape:label="Labels"
