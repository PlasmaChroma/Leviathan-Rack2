    <g fill="none" stroke-linecap="round">
      <path d="M338 410 H1186" stroke="#ffffff" stroke-opacity="0.13" stroke-width="18"/>
      <path d="M338 8350 H1186" stroke="#ffffff" stroke-opacity="0.09" stroke-width="14"/>
